name: Build Otimizado V500 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descompactando $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d temp_extract
            if [ -f "temp_extract/build.gradle.kts" ] || [ -f "temp_extract/settings.gradle.kts" ]; then
              cp -rf temp_extract/* .
            else
              SUBDIR=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
              cp -rf "$SUBDIR"/* .
            fi
            rm -rf temp_extract "$ZIP_FILE"
          fi
          touch .env.example

      - name: Auto-fix folder structure, package names and template files
        run: |
          rm -rf app/src/androidTest app/src/test
          if [ -d "app/src/main/java/com/example" ]; then
            mkdir -p app/src/main/java/com/raylan/otimizadov500
            cp -rf app/src/main/java/com/example/* app/src/main/java/com/raylan/otimizadov500/
            rm -rf app/src/main/java/com/example
          fi
          find app/src/main -type f \( -name "*.kt" -o -name "*.xml" \) -exec sed -i 's/com\.example/com.raylan.otimizadov500/g' {} +
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/com\.example/com.raylan.otimizadov500/g' app/build.gradle.kts
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' app/build.gradle.kts
            sed -i 's/targetSdk = [0-9]*/targetSdk = 36/g' app/build.gradle.kts
          fi
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "otimizado-v500",
              "storage_bucket": "://appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.raylan.otimizadov500"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly1234567890"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate debug.keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otimizado-V500-debug
          path: app/build/outputs/apk/debug/*.apk
          
